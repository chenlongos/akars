# akars 底盘/机械臂运动参数
#
# 改这里就能调参,不用重新编译。板端默认路径 /root/akars.toml(与 /root/akars 同目录);
# 用 `--config PATH` 可指定其它路径。
#
# - 整份文件、每个 [section]、每个字段都可以省略,省略即回退到内置默认值。
# - 文件缺失或解析失败不会中断程序,会打印提示并全部走默认值。

# ── 底盘运动:直线锁定 / 修正脉冲 / 接近速度分级 / 搜索与后退 ──
[chassis]
reference_frame_width = 640.0 # 像素类阈值以此为基准按分辨率缩放
center_margin = 50            # 基础中心死区(像素),偏离中心在此内视为已居中
margin_proximity_gain = 2.0   # 中心死区随接近放大的系数
lane_break_px = 80            # 跑偏判定阈值(像素),超过才起修正脉冲
turn_pulse_speed = 35         # 原地转修正脉冲幅值(角速度)
turn_pulse_speed_diff = 10    # 差速段(远处)修正脉冲幅值,比原地转轻一档
turn_pulse_gain_ms = 400.0    # 脉冲时长增益:时长 = 增益 × 归一化偏差 × 接近阻尼
turn_pulse_min_ms = 55        # 脉冲时长下限(克服静摩擦)
turn_pulse_max_ms = 500       # 脉冲时长上限
correct_settle_ms = 100       # 脉冲后的静置时长(相位裕度,等惯性停稳)
brake_travel_margin = 2.0     # 预测刹车收油余量(以“一帧行程”为单位)
proximity_damp_min = 0.35     # 接近阻尼下限,球越近脉冲压得越短
turn_inplace_area = 0.20      # area_ratio ≥ 此值丢掉前进分量,原地转
chase_far_area = 0.15         # 远/中分级面积阈值
chase_mid_area = 0.20         # 中/近分级面积阈值
chase_speed_far = 35          # 远处接近速度
chase_speed_mid = 25         # 中处接近速度
chase_speed_near = 20         # 近处接近速度(不低于实测能推动整车的下限)
idle_speed = 25               # 丢球后原地慢转搜索速度
backward_speed = 30           # 太近时的后退速度
turn_reverse = false           # 全局转向极性:轮子通道与物理左右反接时置 true,同时纠正追球/搜索/追桶(正常接线用 false;抓取盲转方向看 grab_turn_direction)

# ── 抓取状态机:距离阈值、确认帧数、各段时长 ──
[grab]
grab_area = 0.25               # “够近可抓”的面积阈值
grab_area_max = 0.26           # “太近了、先后退”的面积阈值,须大于 grab_area
grab_turn_count = 2            # 抓取前盲转微调次数(补偿爪子偏心)
grab_turn_speed = 35           # 盲转微调速度(与 grab_turn_ms 成对标定)
grab_turn_direction = "right"  # 盲转方向:left 左转 / right 右转,按爪子相对相机的偏心方向选(逐车不同)
grab_confirm_threshold = 5     # 连续满足“够近且居中”的确认帧数
lost_grace_frames = 8          # 丢失宽限帧数,超过才判定真丢
grab_backoff_ms = 200          # 太近时后退时长
grab_turn_ms = 250             # 每次盲转微调时长
grab_turn_gap_ms = 100         # 两次盲转之间的停稳间隔
grab_close_ms = 200            # 闭爪后等待伺服到位
grab_release_ms = 100          # 松开后等待伺服到位
grab_home_ms = 100             # 归位后回到追球前的等待
chase_bucket = true            # 抓到球后进入“追蓝桶→放球”循环;false 则抓完原地松爪再追下一个球

# ── 机械臂:舵机姿势角度、脉宽标定、抓取动作时序 ──
[arm]
id2_angle_open = 140.0   # 舵机2(爪)张开角度
id2_angle_close = 40.0   # 舵机2(爪)闭合角度
angle_max = 270.0        # 舵机全量程角度(角度→脉宽映射)
pulse_min = 500          # 脉宽下限(对应 0°)
pulse_max = 2500         # 脉宽上限(对应 angle_max)
servo0_ready = 120.0     # 舵机0 待抓/归位
servo1_ready = 185.0     # 舵机1 待抓/归位
servo0_grab = 25.0      # 舵机0 伸到最低(抓取)
servo1_grab = 185.0      # 舵机1 伸到最低(抓取)
servo0_lift = 120.0      # 舵机0 抬起(持球)
servo1_lift = 185.0      # 舵机1 抬起(持球)
grab_move_time_ms = 1000              # 每条 set_angle 指令的运动时长
grab_settle_pre_close_ms = 1500       # 伸到最低、张爪后的等待
grab_settle_close_ms = 1000           # 闭爪后的等待
grab_settle_lift_ms = 1200            # 抬起后的等待

# ── 电机映射:PWM 缩放与死区下限(ppr/pwm_freq 随 CMD_CONFIG 下发) ──
[motor]
speed_scale = 65      # PWM 满量程缩放(百分比)
min_speed = 20        # 死区映射的速度下限
ppr = 4680            # 编码器每转脉冲数
pwm_freq = 20000      # PWM 频率
